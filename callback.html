<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Ads API Callback</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the app */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light gray background */
        }
        .container-card {
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 10px -5px rgba(0, 0, 0, 0.04);
            border-top: 5px solid #1DB954; /* Spotify Green Accent */
        }
        .text-green-spotify {
            color: #1DB954;
        }
        .bg-green-spotify {
            background-color: #1DB954;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(29, 185, 84, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Main Callback Display Card -->
    <div id="callback-card" class="container-card w-full max-w-lg p-8 rounded-xl transition-all duration-300">
        <h1 class="text-3xl font-extrabold mb-4 text-gray-800 flex items-center">
            <svg class="w-8 h-8 mr-3 text-green-spotify" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
            Authorization Callback
        </h1>

        <!-- Status Message Area -->
        <div id="status-message" class="p-4 rounded-lg mb-6 border border-gray-200">
            <p class="text-gray-600 italic">Processing the API response...</p>
        </div>

        <!-- Raw Parameters Display -->
        <div class="mt-6">
            <h2 class="text-xl font-semibold mb-3 text-gray-700">Received Parameters (Raw)</h2>
            <pre id="raw-params" class="bg-gray-100 p-4 rounded-lg overflow-auto text-sm text-gray-800 border border-gray-300">
                Awaiting parameters...
            </pre>
        </div>

        <!-- Call to Action/Next Step -->
        <div class="mt-8 text-center">
            <button id="next-step-button" onclick="copyParamsToClipboard()" class="bg-green-spotify text-white font-bold py-3 px-6 rounded-lg btn-hover transition duration-200 focus:outline-none focus:ring-4 focus:ring-green-spotify focus:ring-opacity-50">
                Copy Code to Clipboard
            </button>
            <p id="copy-status" class="mt-3 text-sm text-gray-500 hidden">Code copied!</p>
        </div>

    </div>

    <script>
        // Use a function to safely get the current app ID (if defined)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        /**
         * Parses the URL query string and updates the UI.
         */
        function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const statusMessage = document.getElementById('status-message');
            const rawParamsPre = document.getElementById('raw-params');
            const nextStepButton = document.getElementById('next-step-button');

            const params = {};
            for (const [key, value] of urlParams.entries()) {
                params[key] = value;
            }

            // Display raw parameters
            rawParamsPre.textContent = JSON.stringify(params, null, 2);

            if (params.error) {
                // --- Authorization Failed ---
                statusMessage.innerHTML = `
                    <div class="flex items-center">
                        <svg class="w-6 h-6 mr-3 text-red-500" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                        <div>
                            <p class="text-lg font-bold text-red-600">Authorization Failed</p>
                            <p class="text-sm text-red-500 mt-1">Error: ${params.error}</p>
                            <p class="text-sm text-red-500">Description: ${params.error_description || 'No description provided.'}</p>
                        </div>
                    </div>
                `;
                statusMessage.classList.add('bg-red-50', 'border-red-300');
                nextStepButton.textContent = "Return to Application";

            } else if (params.code && params.state) {
                // --- Authorization Success ---
                statusMessage.innerHTML = `
                    <div class="flex items-center">
                        <svg class="w-6 h-6 mr-3 text-green-spotify" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        <div>
                            <p class="text-lg font-bold text-green-spotify">Authorization Successful!</p>
                            <p class="text-sm text-gray-500 mt-1">The authorization code has been received.</p>
                        </div>
                    </div>
                `;
                statusMessage.classList.add('bg-green-50', 'border-green-300');
                nextStepButton.textContent = "Copy Authorization Code";
                nextStepButton.onclick = () => copyTextToClipboard(params.code, 'Copy Authorization Code');

            } else {
                // --- Missing Parameters ---
                statusMessage.innerHTML = `
                    <div class="flex items-center">
                        <svg class="w-6 h-6 mr-3 text-yellow-500" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.294 2.503-1.294 3.268 0l1.287 2.18A7.989 7.989 0 0117 10c0 4.418-3.582 8-8 8a8.001 8.001 0 01-5.748-2.312l.149-.092.147-.093L3.8 13.91l.148-.093.15-.094A8 8 0 011 10c0-2.123.83-4.041 2.174-5.467l1.287-2.18zM10 12a1 1 0 100-2 1 1 0 000 2zm0-4a1 1 0 00-2 0v1a1 1 0 102 0V8z" clip-rule="evenodd"></path></svg>
                        <div>
                            <p class="text-lg font-bold text-yellow-600">Awaiting Callback</p>
                            <p class="text-sm text-gray-500 mt-1">No authorization parameters were detected in the URL.</p>
                        </div>
                    </div>
                `;
                statusMessage.classList.add('bg-yellow-50', 'border-yellow-300');
                nextStepButton.textContent = "Go to App Start Page";
                nextStepButton.onclick = () => window.location.href = window.location.origin;
            }
        }

        /**
         * Copies text to the clipboard and shows a status message.
         * @param {string} textToCopy - The text to be copied.
         * @param {string} originalButtonText - The original text of the button.
         */
        function copyTextToClipboard(textToCopy, originalButtonText) {
            const button = document.getElementById('next-step-button');
            const status = document.getElementById('copy-status');

            // Use document.execCommand('copy') as navigator.clipboard.writeText() is restricted in many environments.
            const tempInput = document.createElement('textarea');
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();

            try {
                document.execCommand('copy');
                status.textContent = 'Code successfully copied to clipboard!';
                status.classList.remove('hidden');
                status.classList.add('text-green-600');
                button.textContent = 'Copied!';
            } catch (err) {
                status.textContent = 'Failed to copy. Please manually copy the code from the Raw Parameters box.';
                status.classList.remove('hidden');
                status.classList.add('text-red-600');
            }

            document.body.removeChild(tempInput);

            // Reset button text after a short delay
            setTimeout(() => {
                button.textContent = originalButtonText;
                status.classList.add('hidden');
            }, 3000);
        }

        // Run the handler when the page loads
        window.onload = handleCallback;
    </script>
</body>
</html>
